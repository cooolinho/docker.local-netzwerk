version: '3.8'

services:
    planka-db:
        image: postgres:15-alpine
        container_name: planka-db
        restart: unless-stopped
        networks:
            - docker_lan_network
        environment:
            POSTGRES_DB: planka
            POSTGRES_USER: planka
            POSTGRES_PASSWORD: planka-password-change-me
            TZ: Europe/Berlin
        volumes:
            - planka-db-data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U planka -d planka" ]
            interval: 10s
            timeout: 5s
            retries: 10
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    planka:
        image: ghcr.io/plankanban/planka:latest
        container_name: planka
        restart: unless-stopped
        networks:
            - docker_lan_network
        environment:
            BASE_URL: http://planka.docker.lan
            DATABASE_URL: postgresql://planka:planka-password-change-me@planka-db:5432/planka
            SECRET_KEY: 5c81d785-74a5-4832-b8ef-051002fd1ea6
            TZ: Europe/Berlin
        depends_on:
            planka-db:
                condition: service_healthy
        volumes:
            - planka-user-avatars:/app/public/user-avatars
            - planka-project-background-images:/app/public/project-background-images
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=docker_lan_network"
            - "traefik.http.routers.planka.rule=Host(`planka.docker.lan`)"
            - "traefik.http.routers.planka.entrypoints=web"
            - "traefik.http.services.planka.loadbalancer.server.port=1337"
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

volumes:
    planka-db-data:
    planka-user-avatars:
    planka-project-background-images:

networks:
    docker_lan_network:
        external: true

