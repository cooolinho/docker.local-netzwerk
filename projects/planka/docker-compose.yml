version: '3.8'

services:
    planka-db:
        image: postgres:15-alpine
        container_name: planka-db
        restart: unless-stopped
        networks:
            - "${DOCKER_NETWORK}"
        environment:
            POSTGRES_DB: planka
            POSTGRES_USER: planka
            POSTGRES_PASSWORD: planka-password-change-me
            TZ: Europe/Berlin
        volumes:
            - planka-db-data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U planka -d planka" ]
            interval: 10s
            timeout: 5s
            retries: 10
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    planka:
        image: ghcr.io/plankanban/planka:latest
        container_name: planka
        restart: unless-stopped
        networks:
            - "${DOCKER_NETWORK}"
        environment:
            BASE_URL: http://planka.docker.lan
            DATABASE_URL: postgresql://planka:planka-password-change-me@planka-db:5432/planka
            SECRET_KEY: 5c81d785-74a5-4832-b8ef-051002fd1ea6
            TZ: Europe/Berlin
        depends_on:
            planka-db:
                condition: service_healthy
        volumes:
            - planka-user-avatars:/app/public/user-avatars
            - planka-project-background-images:/app/public/project-background-images
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=${DOCKER_NETWORK}"
            - "traefik.http.routers.${TRAEFIK_SERVICE_NAME}.rule=Host(`${TRAEFIK_SERVICE_NAME}.${TRAEFIK_DOMAIN}`)"
            - "traefik.http.routers.${TRAEFIK_SERVICE_NAME}.entrypoints=web"
            - "traefik.http.services.${TRAEFIK_SERVICE_NAME}.loadbalancer.server.port=${TRAEFIK_PORT:-1337}"
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

volumes:
    planka-db-data:
    planka-user-avatars:
    planka-project-background-images:

networks:
    docker_lan_network:
        external: true

