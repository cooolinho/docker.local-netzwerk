version: '3.8'

services:
    portainer:
        image: portainer/portainer-ce:latest
        container_name: portainer
        restart: unless-stopped
        networks:
            - "${DOCKER_NETWORK}"
        # Portainer braucht Zugriff auf Docker Socket für Container-Management
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - portainer-data:/data
        environment:
            - TZ=Europe/Berlin
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=${DOCKER_NETWORK}"
            - "traefik.http.routers.${TRAEFIK_SERVICE_NAME}.rule=Host(`${TRAEFIK_SERVICE_NAME}.${TRAEFIK_DOMAIN}`)"
            - "traefik.http.routers.${TRAEFIK_SERVICE_NAME}.entrypoints=web"
            - "traefik.http.services.${TRAEFIK_SERVICE_NAME}.loadbalancer.server.port=${TRAEFIK_PORT:-9000}"
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

volumes:
    portainer-data:

networks:
    docker_lan_network:
        external: true

