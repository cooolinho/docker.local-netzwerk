services:
    roundcube:
        container_name: roundcube
        image: roundcube/roundcubemail:latest
        restart: always
        environment:
            - "ROUNDCUBEMAIL_DEFAULT_HOST=${ROUNDCUBEMAIL_DEFAULT_HOST}"
            - "ROUNDCUBEMAIL_SMTP_SERVER=${ROUNDCUBEMAIL_SMTP_SERVER}"
            - "ROUNDCUBEMAIL_SMTP_PORT=${ROUNDCUBEMAIL_SMTP_PORT}"
            - "ROUNDCUBEMAIL_IMAP_PORT=${ROUNDCUBEMAIL_IMAP_PORT}"
            - "ROUNDCUBEMAIL_PLUGINS=alias_auth"
            - "ROUNDCUBEMAIL_DB_TYPE=${ROUNDCUBEMAIL_DB_TYPE}"
            - "ROUNDCUBEMAIL_DB_HOST=${ROUNDCUBEMAIL_DB_HOST}"
            - "ROUNDCUBEMAIL_DB_USER=${ROUNDCUBEMAIL_DB_USER}"
            - "ROUNDCUBEMAIL_DB_PASSWORD=${ROUNDCUBEMAIL_DB_PASSWORD}"
            - "ROUNDCUBEMAIL_DB_NAME=${ROUNDCUBEMAIL_DB_NAME}"
        depends_on:
            - roundcube-db
        volumes:
            - roundcube_data:/var/www/html
            - ./roundcube/plugins/alias_auth:/var/www/html/plugins/alias_auth:ro
            - ./secrets:/run/secrets:ro
        networks:
            - "${DOCKER_NETWORK}"
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=${DOCKER_NETWORK}"
            - "traefik.http.routers.${TRAEFIK_SERVICE_NAME}.rule=Host(`${TRAEFIK_SERVICE_NAME}.${TRAEFIK_DOMAIN}`)"
            - "traefik.http.routers.${TRAEFIK_SERVICE_NAME}.entrypoints=web"
            - "traefik.http.services.${TRAEFIK_SERVICE_NAME}.loadbalancer.server.port=${TRAEFIK_PORT:-80}"
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    roundcube-db:
        image: mariadb:latest
        container_name: roundcube-db
        restart: always
        environment:
            - "MYSQL_DATABASE=${ROUNDCUBEMAIL_DB_NAME}"
            - "MYSQL_USER=${ROUNDCUBEMAIL_DB_USER}"
            - "MYSQL_PASSWORD=${ROUNDCUBEMAIL_DB_PASSWORD}"
            - "MYSQL_ROOT_PASSWORD=${ROUNDCUBEMAIL_DB_ROOT_PASSWORD}"
        volumes:
            - roundcube_db_data:/var/lib/mysql
        networks:
            - "${DOCKER_NETWORK}"
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

volumes:
    roundcube_data:
    roundcube_db_data:

networks:
    docker_lan_network:
        external: true
