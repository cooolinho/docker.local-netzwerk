version: '3.8'

services:
  private-project-2:
    image: your-image:latest  # ÄNDERN: Dein Image hier eintragen
    container_name: private-project-2
    restart: unless-stopped
    networks:
      - docker-local-network
    environment:
      TZ: Europe/Berlin
      # ÄNDERN: Deine Umgebungsvariablen hier eintragen
    # volumes:
    #   - ./data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.private-project-2.rule=Host(`private-project-2.docker.local`)"
      - "traefik.http.routers.private-project-2.entrypoints=web"
      - "traefik.http.services.private-project-2.loadbalancer.server.port=3000"  # ÄNDERN: Port anpassen
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  docker-local-network:
    external: true

