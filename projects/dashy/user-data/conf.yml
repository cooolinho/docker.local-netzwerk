# Dashy Config - Lokales Dashboard
# https://dashy.to/docs/configuration

pageInfo:
  title: Docker Local Network
  description: Zentrale Startseite fuer lokale Docker Services
  navLinks:
    - title: Traefik Docs
      path: https://doc.traefik.io/

appConfig:
  theme: material
  language: de
  layout: auto
  iconSize: medium
  enableFontAwesome: true
  colCount: 4

sections:
  - name: Infrastruktur
    icon: fas fa-cogs
    displayData:
      sortBy: default
      cols: 3
    items:
      - title: Traefik Dashboard
        description: Reverse Proxy Management
        url: http://traefik.docker.lan
        icon: /traefik.png
        target: newtab
        id: infra_traefik
        statusCheck: true
        statusCheckUrl: http://monitor-api:monitor-readonly@traefik.docker.lan/api/http/services/traefik-dockerlocal-netzwerk%40docker
      - title: Portainer
        description: Docker Management UI
        url: http://portainer.docker.lan
        icon: /portainer.jpg
        target: newtab
        id: infra_portainer
        statusCheck: true
        statusCheckUrl: http://monitor-api:monitor-readonly@traefik.docker.lan/api/http/services/portainer%40docker
      - title: Docker Host
        description: 192.168.178.6
        url: http://192.168.178.6
        icon: fas fa-server
        target: newtab
        id: infra_host
      - title: Glances
        description: System Monitoring
        url: http://glances.docker.lan
        icon: /glances.png
        target: newtab
        id: infra_glances
        statusCheck: true
        statusCheckUrl: http://monitor-api:monitor-readonly@traefik.docker.lan/api/http/services/glances%40docker
      - title: Dozzle
        description: Echtzeit Container Log Viewer
        url: http://dozzle.docker.lan
        icon: /dozzle.png
        target: newtab
        id: infra_dozzle
        statusCheck: true
        statusCheckUrl: http://monitor-api:monitor-readonly@traefik.docker.lan/api/http/services/dozzle%40docker
      - title: Grafana
        description: Visualisierung & Log-Explorer
        url: http://grafana.docker.lan
        icon: /grafana.png
        target: newtab
        id: infra_grafana
        statusCheck: true
        statusCheckUrl: http://monitor-api:monitor-readonly@traefik.docker.lan/api/http/services/grafana%40docker

  - name: Anwendungen
    icon: fas fa-cube
    displayData:
      sortBy: default
      cols: 3
    items:
      - title: Dashy
        description: Personal Dashboard
        url: http://dashy.docker.lan
        icon: /dashy.png
        target: newtab
        id: app_dashy
        statusCheck: true
        statusCheckUrl: http://monitor-api:monitor-readonly@traefik.docker.lan/api/http/services/dashy%40docker
      - title: IT-Tools
        description: IT-Werkzeug-Sammlung
        url: http://it-tools.docker.lan
        icon: /it-tools.png
        target: newtab
        id: app_ittools
        statusCheck: true
        statusCheckUrl: http://monitor-api:monitor-readonly@traefik.docker.lan/api/http/services/it-tools%40docker
      - title: Planka
        description: Kanban Board
        url: http://planka.docker.lan
        icon: /planka.png
        target: newtab
        id: app_planka
        statusCheck: true
        statusCheckUrl: http://monitor-api:monitor-readonly@traefik.docker.lan/api/http/services/planka%40docker
      - title: Roundcube
        description: Webmail Client
        url: http://mail.docker.lan
        icon: /roundcube.jpg
        target: newtab
        id: app_roundcube
        statusCheck: true
        statusCheckUrl: http://monitor-api:monitor-readonly@traefik.docker.lan/api/http/services/roundcube%40docker
      - title: CloudBeaver
        description: Datenbank Management UI
        url: http://cloudbeaver.docker.lan
        icon: /cloudbeaver.png
        target: newtab
        id: app_cloudbeaver
        statusCheck: true
        statusCheckUrl: http://monitor-api:monitor-readonly@traefik.docker.lan/api/http/services/cloudbeaver%40docker

  - name: Private Projekte
    icon: fas fa-cube
    displayData:
      sortBy: default
      cols: 3
    items:
      - title: My Media Library
        description: Dein Projekt
        url: http://my-media-library.docker.lan/admin
        icon: fas fa-lock
        target: newtab
        id: app_my_media_library
        statusCheck: true
        statusCheckUrl: http://monitor-api:monitor-readonly@traefik.docker.lan/api/http/services/my-media-library%40docker

  - name: Dokumentation
    icon: fas fa-book
    displayData:
      collapsed: false
    items:
      - title: README
        description: Setup und Konfiguration
        url: https://github.com/cooolinho/docker.local-netzwerk/blob/main/projects/dashy/README.md
        icon: fas fa-file-alt
        id: docs_readme
      - title: Docker Compose
        description: Offizielle Doku
        url: https://docs.docker.com/compose/
        icon: fab fa-docker
        target: newtab
        id: docs_compose
      - title: Traefik
        description: Reverse Proxy Doku
        url: https://doc.traefik.io/
        icon: fas fa-arrows-alt-v
        target: newtab
        id: docs_traefik

