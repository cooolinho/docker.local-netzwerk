version: '3.8'

services:
  dashy:
    image: lissy93/dashy:latest
    container_name: dashy
    restart: unless-stopped
    networks:
      - docker-local-network
    # Ports müssen NICHT exponiert werden, da Traefik den Container direkt über das Netzwerk erreicht
    # ports:
    #   - "3000:80"
    environment:
      - TZ=Europe/Berlin
      - NODE_ENV=production
    volumes:
      - ./conf.yml:/app/public/conf.yml:ro
      - dashy-data:/app/public/item-icons
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashy.rule=Host(`dashy.docker.local`)"
      - "traefik.http.routers.dashy.entrypoints=web"
      - "traefik.http.services.dashy.loadbalancer.server.port=80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dashy-data:

networks:
  docker-local-network:
    external: true

