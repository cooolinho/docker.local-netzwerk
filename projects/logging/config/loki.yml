# Loki Konfiguration
# ==================
# Einzelner Server-Modus (kein Clustering)

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Schema-Konfiguration (tsdb ist der aktuelle Standard)
schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Log-Retention: 30 Tage = 720 Stunden
limits_config:
  retention_period: 720h
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_query_length: 0h  # Keine Limit bei Query-Länge

# Compactor für automatische Retention-Bereinigung
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

# Query-Optimierungen
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

# Ruler (optional, für Alerting)
ruler:
  alertmanager_url: http://localhost:9093

# Analytics deaktivieren
analytics:
  reporting_enabled: false

