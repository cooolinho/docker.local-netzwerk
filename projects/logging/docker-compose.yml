version: '3.8'

services:
    # ─────────────────────────────────────────────────────────────────────────────
    # Loki – Log-Aggregation & Storage
    # Interner Service: kein Traefik, nur im docker_lan_network erreichbar
    # ─────────────────────────────────────────────────────────────────────────────
    loki:
        image: grafana/loki:3.5.1
        container_name: loki
        restart: unless-stopped
        networks:
            - "${DOCKER_NETWORK}"
        command: -config.file=/etc/loki/loki.yml
        volumes:
            - ./config/loki.yml:/etc/loki/loki.yml:ro
            - loki-data:/loki
        healthcheck:
            test: ["CMD-SHELL", "wget -q --tries=1 --spider http://localhost:3100/ready || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        logging:
            driver: "json-file"
            options:
                max-size: "5m"
                max-file: "2"

    # ─────────────────────────────────────────────────────────────────────────────
    # Promtail – Log-Shipper
    # Liest Docker-Container-Logs und sendet sie an Loki
    # ─────────────────────────────────────────────────────────────────────────────
    promtail:
        image: grafana/promtail:3.5.1
        container_name: promtail
        restart: unless-stopped
        networks:
            - "${DOCKER_NETWORK}"
        command: -config.file=/etc/promtail/promtail.yml
        volumes:
            - ./config/promtail.yml:/etc/promtail/promtail.yml:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - /var/lib/docker/containers:/var/lib/docker/containers:ro
            - promtail-positions:/tmp
        depends_on:
            loki:
                condition: service_healthy
        logging:
            driver: "json-file"
            options:
                max-size: "5m"
                max-file: "2"

    # ─────────────────────────────────────────────────────────────────────────────
    # Grafana – Visualisierung & Log-Explorer
    # Erreichbar unter: http://grafana.docker.lan
    # ─────────────────────────────────────────────────────────────────────────────
    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        restart: unless-stopped
        networks:
            - "${DOCKER_NETWORK}"
        environment:
            - TZ=${TZ:-Europe/Berlin}
            - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
            - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?Bitte GF_SECURITY_ADMIN_PASSWORD in .env setzen}
            - GF_SERVER_DOMAIN=grafana.docker.lan
            - GF_SERVER_ROOT_URL=http://grafana.docker.lan
            # Anonymen Zugriff deaktivieren
            - GF_AUTH_ANONYMOUS_ENABLED=false
            # Analytics deaktivieren
            - GF_ANALYTICS_REPORTING_ENABLED=false
            - GF_ANALYTICS_CHECK_FOR_UPDATES=false
            # Alerting-Meldung beim Start unterdrücken
            - GF_ALERTING_ENABLED=false
            - GF_UNIFIED_ALERTING_ENABLED=false
        volumes:
            - grafana-data:/var/lib/grafana
            - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=${DOCKER_NETWORK}"
            - "traefik.http.routers.${TRAEFIK_SERVICE_NAME}.rule=Host(`${TRAEFIK_SERVICE_NAME}.${TRAEFIK_DOMAIN}`)"
            - "traefik.http.routers.${TRAEFIK_SERVICE_NAME}.entrypoints=web"
            - "traefik.http.services.${TRAEFIK_SERVICE_NAME}.loadbalancer.server.port=${TRAEFIK_PORT:-3000}"
        depends_on:
            loki:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -q --tries=1 --spider http://localhost:3000/api/health || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 40s
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

volumes:
    loki-data:
    grafana-data:
    promtail-positions:

networks:
    docker_lan_network:
        external: true

